services:
  db:
    build:
      context: ../..
      dockerfile: docker/platform/Dockerfile-mariadb
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=somewordpress
      - MARIADB_DATABASE=wordpress
      - MARIADB_USER=wordpress
      - MARIADB_PASSWORD=wordpress
    expose:
      - 3306
    hostname: db
    cap_add:
      - SYS_PTRACE
  wordpress:
    build:
      context: ../..
      dockerfile: docker/platform/Dockerfile-wordpress
    ports:
      - 0.0.0.0:8090:80
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
    hostname: wordpress
    cap_add:
      - SYS_PTRACE
volumes:
  db_data:

